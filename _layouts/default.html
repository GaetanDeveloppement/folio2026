<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.15/dist/lenis.css">
  </head>
  <body style="--scale-image: 1.4;">
      <main>
        <div>
            <div>
                {{ content }}
            </div>
        </div>
        <div id="wrapper" class="project-list">
            <div id="scroller">
                {% for project in site.data.projects %}
                    <div>
                        {% if project.link %}
                            <a href={{project.link}}>
                                <div class="image-container">
                                    <img class="parallax" src="../assets/image/{{ project.image }}" alt={{project.alt}} />
                                </div>
                                <p class={{project.color}}>{{ project.title }}</p>
                            </a>
                        {% else %}
                            <div class="image-container">
                                <img class="parallax" src="../assets/image/{{ project.image }}" alt={{project.alt}} />
                            </div>
                            <p class={{project.color}}>{{ project.title }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
        </div>
      </main>

      <script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js"></script>
      <script>
        const { log } = console

        const images = []
        const scale = document.body.style.getPropertyValue("--scale-image")
        const scrollContainerHeight = document.body.clientHeight

        document.querySelectorAll('#scroller .parallax').forEach((el, index) => {
          const height = parseInt(el.clientHeight) * scale
          const containerHeight = parseInt(el.parentNode.clientHeight);
          const gap = height - containerHeight;

          el.dataset.index = index
          images.push({ height, containerHeight, gap })
        })

        console.log(images)

        const scroller = document.getElementById('scroller')
        const wrapper = document.getElementById('wrapper')

        const clone = scroller.cloneNode(true)
        scroller.after(clone)
        clone.id = 'clone'
        const lenis = new Lenis({
          autoRaf: true,
          infinite: true,
          syncTouch: true,
          wrapper,
          eventsTarget: window
        });

        const items = document.querySelectorAll('.parallax')

        // Use requestAnimationFrame to continuously update the scroll
        function raf(time) {
          lenis.raf(time);

          items.forEach((el) => {
            const index = el.dataset["index"]
            const { containerHeight, height, gap } = images[index]
            const y = el.y
            const pos = {
              top: y + containerHeight,
              bottom: y,
            }

            if(pos.top >= 0 && pos.bottom < scrollContainerHeight) {
              // 0 / 1
              const factor = pos.top / (scrollContainerHeight + containerHeight)

              // -1 / 1
              const power = (factor - .5) * 2
              const res = (gap / 2) * factor

              el.style.setProperty('--offset', res + 'px')
            }
          })


          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
      </script>
  </body>
</html>
