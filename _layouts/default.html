<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.15/dist/lenis.css">
    <link rel="icon" type="image/x-icon" href="../Assets/image/favicon.png">
  </head>
  <body style="--scale-image: 1.25;">
      <main>
        <div class="info">
            <div>
                {{ content }}
            </div>
        </div>

        <div class="projects">
            <div id="wrapper" class="project-list">
                <div id="scroller">
                    {% for project in site.data.projects %}
                        <div>
                            {% if project.link %}
                                <a href={{project.link}}>
                                    <div class="image-container">
                                        <img class="parallax" src="../assets/image/{{ project.image }}" alt={{project.alt}} />
                                    </div>
                                    <p class={{project.color}} style="color: {{project.hex}};">{{ project.title }}</p>
                                </a>
                            {% else %}
                                <div class="image-container">
                                    <img class="parallax" src="../assets/image/{{ project.image }}" alt={{project.alt}} />
                                </div>
                                <p class={{project.color}}>{{ project.title }}</p>
                            {% endif %}
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
      </main>

      <script src="https://unpkg.com/lenis@1.3.15/dist/lenis.min.js"></script>
      <script src="../assets/js/index.js"></script>
  </body>
</html>
